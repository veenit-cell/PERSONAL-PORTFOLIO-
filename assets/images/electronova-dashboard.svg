<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="robo-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0e1310"/>
      <stop offset="100%" stop-color="#141c17"/>
    </linearGradient>
    <linearGradient id="robo-panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1b2820"/>
      <stop offset="100%" stop-color="#131e18"/>
    </linearGradient>
    <filter id="robo-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#robo-bg)"/>

  <!-- Top Navigation Bar -->
  <rect x="24" y="20" width="1152" height="56" rx="8" fill="url(#robo-panel)" stroke="#263b2f" stroke-width="1"/>
  <circle cx="56" cy="48" r="8" fill="#d4f34a"/>
  <text x="76" y="53" font-family="-apple-system, sans-serif" font-size="16" font-weight="700" fill="#f8f8f2" letter-spacing="0.5">ELECTRONOVA // AUTONOMOUS ROBOTICS TELEMETRY &amp; CONTROL</text>
  <rect x="560" y="34" width="150" height="26" rx="13" fill="#1b3624" stroke="#2c5e3d" stroke-width="1"/>
  <circle cx="574" cy="47" r="4" fill="#22c55e"/>
  <text x="586" y="51" font-family="'Space Mono', monospace" font-size="10" font-weight="700" fill="#a7f3d0">MAZE AUTO-NAV LIVE</text>
  <text x="960" y="52" font-family="'Space Mono', monospace" font-size="11" fill="#7ba388">PID CONTROL LOOP : 1.2ms</text>
  <circle cx="1144" cy="48" r="14" fill="#1f3629" stroke="#335943" stroke-width="1"/>
  <text x="1138" y="52" font-family="sans-serif" font-size="11" fill="#d4f34a" font-weight="bold">VR</text>

  <!-- Stat Cards Row -->
  <g transform="translate(24, 92)" filter="url(#robo-shadow)">
    <rect width="270" height="84" rx="8" fill="url(#robo-panel)" stroke="#263b2f" stroke-width="1"/>
    <text x="18" y="28" font-family="'Space Mono', monospace" font-size="10" fill="#7ba388">CONTROL LOOP LATENCY</text>
    <text x="18" y="60" font-family="sans-serif" font-size="28" font-weight="700" fill="#d4f34a">1.24 ms</text>
    <text x="160" y="60" font-family="'Space Mono', monospace" font-size="11" fill="#22c55e">800 Hz EDGE</text>
  </g>
  <g transform="translate(318, 92)" filter="url(#robo-shadow)">
    <rect width="270" height="84" rx="8" fill="url(#robo-panel)" stroke="#263b2f" stroke-width="1"/>
    <text x="18" y="28" font-family="'Space Mono', monospace" font-size="10" fill="#7ba388">OBSTACLE CLEARANCE</text>
    <text x="18" y="60" font-family="sans-serif" font-size="28" font-weight="700" fill="#f8f8f2">18.4 cm</text>
    <text x="160" y="60" font-family="'Space Mono', monospace" font-size="11" fill="#38bdf8">SAFETY: SAFE</text>
  </g>
  <g transform="translate(612, 92)" filter="url(#robo-shadow)">
    <rect width="270" height="84" rx="8" fill="url(#robo-panel)" stroke="#263b2f" stroke-width="1"/>
    <text x="18" y="28" font-family="'Space Mono', monospace" font-size="10" fill="#7ba388">PID STEERING ERROR</text>
    <text x="18" y="60" font-family="sans-serif" font-size="28" font-weight="700" fill="#f59e0b">0.32%</text>
    <text x="160" y="60" font-family="'Space Mono', monospace" font-size="11" fill="#a7f3d0">CONVERGED</text>
  </g>
  <g transform="translate(906, 92)" filter="url(#robo-shadow)">
    <rect width="270" height="84" rx="8" fill="url(#robo-panel)" stroke="#263b2f" stroke-width="1"/>
    <text x="18" y="28" font-family="'Space Mono', monospace" font-size="10" fill="#7ba388">NATIONAL AWARD</text>
    <text x="18" y="60" font-family="sans-serif" font-size="26" font-weight="700" fill="#facc15">1st Place</text>
    <text x="160" y="60" font-family="'Space Mono', monospace" font-size="11" fill="#fde047">DATA INNOVATION</text>
  </g>

  <!-- Left Main Panel: Polar Radar Proximity Scan & Waveforms -->
  <g transform="translate(24, 192)" filter="url(#robo-shadow)">
    <rect width="760" height="460" rx="8" fill="#0d1712" stroke="#263b2f" stroke-width="1"/>
    
    <text x="24" y="36" font-family="-apple-system, sans-serif" font-size="16" font-weight="700" fill="#f8f8f2">Sensor Fusion Array &amp; Motor PID Regulation</text>
    <text x="24" y="56" font-family="'Space Mono', monospace" font-size="10" fill="#7ba388">DUAL ULTRASONIC + INFRARED PROXIMITY TELEMETRY</text>

    <!-- Polar Proximity Scanner on Left Side -->
    <g transform="translate(200, 250)">
      <!-- Radar circles -->
      <circle r="140" fill="none" stroke="#1b3826" stroke-width="1" stroke-dasharray="4,4"/>
      <circle r="105" fill="none" stroke="#1b3826" stroke-width="1"/>
      <circle r="70" fill="none" stroke="#244d34" stroke-width="1.5"/>
      <circle r="35" fill="none" stroke="#244d34" stroke-width="1.5"/>
      <line x1="-150" y1="0" x2="150" y2="0" stroke="#1b3826" stroke-width="1"/>
      <line x1="0" y1="-150" x2="0" y2="150" stroke="#1b3826" stroke-width="1"/>

      <!-- Radar sweeping line -->
      <line x1="0" y1="0" x2="98" y2="-98" stroke="#d4f34a" stroke-width="2"/>
      <path d="M 0,0 L 98,-98 A 140 140 0 0 0 0,-140 Z" fill="#d4f34a" fill-opacity="0.12"/>

      <!-- Robot Position Center Icon -->
      <polygon points="0,-12 9,10 -9,10" fill="#38bdf8"/>
      <circle r="4" fill="#f8f8f2"/>

      <!-- Obstacle Blips (Maze Walls) -->
      <circle cx="-62" cy="-70" r="5" fill="#ef4444"/>
      <circle cx="-40" cy="-90" r="5" fill="#ef4444"/>
      <circle cx="80" cy="-55" r="5" fill="#ef4444"/>
      <circle cx="110" cy="-40" r="5" fill="#ef4444"/>

      <!-- Forward Cleared Corridor Vector -->
      <line x1="0" y1="0" x2="18" y2="-120" stroke="#22c55e" stroke-width="3" stroke-linecap="round"/>
      <polygon points="18,-130 12,-116 24,-116" fill="#22c55e"/>

      <text x="-50" y="155" font-family="'Space Mono', monospace" font-size="10" fill="#d4f34a">360° SENSOR MESH SCAN</text>
    </g>

    <!-- Right Side: Dual PID Waveform Curves -->
    <g transform="translate(410, 110)">
      <rect width="326" height="310" rx="6" fill="#13231a" stroke="#263b2f" stroke-width="1"/>
      <text x="18" y="28" font-family="'Space Mono', monospace" font-size="10" font-weight="700" fill="#d4f34a">PID MOTOR VELOCITY (PWM)</text>

      <!-- Grid lines -->
      <line x1="18" y1="80" x2="308" y2="80" stroke="#1e3b2b" stroke-width="1" stroke-dasharray="4,4"/>
      <line x1="18" y1="140" x2="308" y2="140" stroke="#1e3b2b" stroke-width="1" stroke-dasharray="4,4"/>
      <line x1="18" y1="200" x2="308" y2="200" stroke="#1e3b2b" stroke-width="1" stroke-dasharray="4,4"/>
      <line x1="18" y1="260" x2="308" y2="260" stroke="#2a533d" stroke-width="1"/>

      <!-- Left Wheel PWM Waveform -->
      <path d="M 18,170 Q 60,110 110,135 T 200,120 T 308,125" fill="none" stroke="#d4f34a" stroke-width="2.5"/>
      <!-- Right Wheel PWM Waveform -->
      <path d="M 18,185 Q 70,140 120,150 T 210,132 T 308,128" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4,2"/>

      <text x="18" y="290" font-family="'Space Mono', monospace" font-size="10" fill="#d4f34a">― LEFT PWM</text>
      <text x="140" y="290" font-family="'Space Mono', monospace" font-size="10" fill="#38bdf8">-- RIGHT PWM</text>
      <text x="250" y="290" font-family="'Space Mono', monospace" font-size="10" fill="#22c55e">SYNC: OK</text>
    </g>
  </g>

  <!-- Right Panel: Telemetry State Machine & Diagnostics -->
  <g transform="translate(804, 192)" filter="url(#robo-shadow)">
    <rect width="372" height="460" rx="8" fill="url(#robo-panel)" stroke="#263b2f" stroke-width="1"/>
    
    <text x="24" y="36" font-family="-apple-system, sans-serif" font-size="16" font-weight="700" fill="#f8f8f2">Firmware State Machine</text>
    <text x="24" y="56" font-family="'Space Mono', monospace" font-size="10" fill="#7ba388">REAL-TIME EMBEDDED C++ KERNEL</text>

    <!-- State 1 -->
    <rect x="20" y="76" width="332" height="64" rx="6" fill="#14261c" stroke="#254a34" stroke-width="1"/>
    <text x="34" y="100" font-family="'Space Mono', monospace" font-size="10" font-weight="700" fill="#d4f34a">STATE: DYNAMIC_WALL_FOLLOW</text>
    <text x="34" y="122" font-family="sans-serif" font-size="12" fill="#cbd5e1">Sensor delta &lt; 1.5 cm. Holding left bearing.</text>

    <!-- State 2 -->
    <rect x="20" y="150" width="332" height="64" rx="6" fill="#122017" stroke="#1d3625" stroke-width="1"/>
    <text x="34" y="174" font-family="'Space Mono', monospace" font-size="10" font-weight="700" fill="#38bdf8">STATE: 90° CORRIDOR_TURN</text>
    <text x="34" y="196" font-family="sans-serif" font-size="12" fill="#94a3b8">Differential encoder pulse lock active.</text>

    <!-- Hardware Health Readouts Box -->
    <rect x="20" y="226" width="332" height="210" rx="6" fill="#0a120e" stroke="#1b3022" stroke-width="1"/>
    <text x="34" y="254" font-family="'Space Mono', monospace" font-size="10" fill="#22c55e" font-weight="700">HARDWARE SENSOR TELEMETRY</text>

    <text x="34" y="284" font-family="'Space Mono', monospace" font-size="11" fill="#cbd5e1">Ultrasonic_Left (HC-SR04):</text>
    <text x="290" y="284" font-family="'Space Mono', monospace" font-size="11" fill="#d4f34a">18.4 cm</text>

    <text x="34" y="314" font-family="'Space Mono', monospace" font-size="11" fill="#cbd5e1">Ultrasonic_Right (HC-SR04):</text>
    <text x="290" y="314" font-family="'Space Mono', monospace" font-size="11" fill="#d4f34a">42.8 cm</text>

    <text x="34" y="344" font-family="'Space Mono', monospace" font-size="11" fill="#cbd5e1">Infrared_Center_Array:</text>
    <text x="290" y="344" font-family="'Space Mono', monospace" font-size="11" fill="#22c55e">CLEAR</text>

    <text x="34" y="374" font-family="'Space Mono', monospace" font-size="11" fill="#cbd5e1">6-Axis IMU (MPU-6050):</text>
    <text x="280" y="374" font-family="'Space Mono', monospace" font-size="11" fill="#38bdf8">Δ 0.08°/s</text>

    <text x="34" y="404" font-family="'Space Mono', monospace" font-size="11" fill="#cbd5e1">Battery Supply (LiPo 3S):</text>
    <text x="290" y="404" font-family="'Space Mono', monospace" font-size="11" fill="#22c55e">11.9 V</text>

    <rect x="34" y="416" width="304" height="6" rx="3" fill="#1b3022"/>
    <rect x="34" y="416" width="260" height="6" rx="3" fill="#22c55e"/>
  </g>
</svg>
