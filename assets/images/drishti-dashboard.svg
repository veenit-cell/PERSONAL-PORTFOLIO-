<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1315"/>
      <stop offset="100%" stop-color="#121e21"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#18272a"/>
      <stop offset="100%" stop-color="#142124"/>
    </linearGradient>
    <linearGradient id="glow-lime" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#d4f34a" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.4"/>
    </linearGradient>
    <linearGradient id="map-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#12252a"/>
      <stop offset="100%" stop-color="#0d191c"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="675" fill="url(#bg)"/>

  <!-- Top Navigation Bar -->
  <rect x="24" y="20" width="1152" height="56" rx="8" fill="url(#panel)" stroke="#22363a" stroke-width="1"/>
  <circle cx="56" cy="48" r="8" fill="#d4f34a"/>
  <text x="76" y="53" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#f8f8f2" letter-spacing="0.5">DRISHTI // DISASTER RESPONSE PLATFORM</text>
  <rect x="420" y="34" width="120" height="26" rx="13" fill="#1f373c" stroke="#2b474e" stroke-width="1"/>
  <circle cx="434" cy="47" r="4" fill="#22c55e"/>
  <text x="446" y="51" font-family="'Space Mono', monospace" font-size="10" font-weight="700" fill="#a7f3d0">INCIDENT ACTIVE</text>
  <text x="1000" y="52" font-family="'Space Mono', monospace" font-size="11" fill="#788a8c">POSTGIS / FASTAPI : LIVE</text>
  <circle cx="1144" cy="48" r="14" fill="#203a3f" stroke="#37555b" stroke-width="1"/>
  <text x="1138" y="52" font-family="sans-serif" font-size="11" fill="#d4f34a" font-weight="bold">VR</text>

  <!-- Stat Cards Row -->
  <!-- Stat 1 -->
  <g transform="translate(24, 92)" filter="url(#shadow)">
    <rect width="270" height="84" rx="8" fill="url(#panel)" stroke="#22363a" stroke-width="1"/>
    <text x="18" y="28" font-family="'Space Mono', monospace" font-size="10" fill="#788a8c" letter-spacing="0.5">AFFECTED SECTORS</text>
    <text x="18" y="60" font-family="sans-serif" font-size="28" font-weight="700" fill="#f8f8f2">14 Zones</text>
    <text x="160" y="60" font-family="'Space Mono', monospace" font-size="11" fill="#ef4444">▲ +3 CRITICAL</text>
  </g>
  <!-- Stat 2 -->
  <g transform="translate(318, 92)" filter="url(#shadow)">
    <rect width="270" height="84" rx="8" fill="url(#panel)" stroke="#22363a" stroke-width="1"/>
    <text x="18" y="28" font-family="'Space Mono', monospace" font-size="10" fill="#788a8c" letter-spacing="0.5">RESCUE TEAMS DEPLOYED</text>
    <text x="18" y="60" font-family="sans-serif" font-size="28" font-weight="700" fill="#d4f34a">38 Units</text>
    <text x="160" y="60" font-family="'Space Mono', monospace" font-size="11" fill="#22c55e">94% READINESS</text>
  </g>
  <!-- Stat 3 -->
  <g transform="translate(612, 92)" filter="url(#shadow)">
    <rect width="270" height="84" rx="8" fill="url(#panel)" stroke="#22363a" stroke-width="1"/>
    <text x="18" y="28" font-family="'Space Mono', monospace" font-size="10" fill="#788a8c" letter-spacing="0.5">EVACUATION CORRIDORS</text>
    <text x="18" y="60" font-family="sans-serif" font-size="28" font-weight="700" fill="#38bdf8">7 Cleared</text>
    <text x="160" y="60" font-family="'Space Mono', monospace" font-size="11" fill="#38bdf8">2 PENDING</text>
  </g>
  <!-- Stat 4 -->
  <g transform="translate(906, 92)" filter="url(#shadow)">
    <rect width="270" height="84" rx="8" fill="url(#panel)" stroke="#22363a" stroke-width="1"/>
    <text x="18" y="28" font-family="'Space Mono', monospace" font-size="10" fill="#788a8c" letter-spacing="0.5">DECISION CONFIDENCE</text>
    <text x="18" y="60" font-family="sans-serif" font-size="28" font-weight="700" fill="#f59e0b">97.8%</text>
    <text x="160" y="60" font-family="'Space Mono', monospace" font-size="11" fill="#a7f3d0">HUMAN VETO ON</text>
  </g>

  <!-- Main Center GIS Map Section -->
  <g transform="translate(24, 192)" filter="url(#shadow)">
    <rect width="760" height="460" rx="8" fill="url(#map-grad)" stroke="#22363a" stroke-width="1"/>
    <!-- Grid overlay -->
    <path d="M 0,100 L 760,100 M 0,200 L 760,200 M 0,300 L 760,300 M 0,400 L 760,400 M 150,0 L 150,460 M 300,0 L 300,460 M 450,0 L 450,460 M 600,0 L 600,460" stroke="#1c3035" stroke-width="1" stroke-dasharray="4,4"/>
    
    <!-- Map Vector Contours -->
    <path d="M 80,360 Q 220,180 380,240 T 680,120" fill="none" stroke="#25474f" stroke-width="2"/>
    <path d="M 120,420 Q 320,320 460,360 T 720,280" fill="none" stroke="#25474f" stroke-width="2"/>
    
    <!-- Evacuation Route Highlight -->
    <path d="M 160,340 L 260,280 L 390,300 L 480,210 L 620,180" fill="none" stroke="#d4f34a" stroke-width="4" stroke-linecap="round"/>
    <!-- Alternate Route -->
    <path d="M 260,280 L 320,380 L 490,390" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-dasharray="6,4"/>

    <!-- Map Nodes / Hotspots -->
    <circle cx="160" cy="340" r="18" fill="#ef4444" fill-opacity="0.25"/>
    <circle cx="160" cy="340" r="8" fill="#ef4444"/>
    <text x="140" y="375" font-family="'Space Mono', monospace" font-size="10" font-weight="700" fill="#f87171">INCIDENT #08</text>

    <circle cx="390" cy="300" r="14" fill="#f59e0b" fill-opacity="0.25"/>
    <circle cx="390" cy="300" r="7" fill="#f59e0b"/>
    <text x="365" y="328" font-family="'Space Mono', monospace" font-size="10" font-weight="700" fill="#fcd34d">CHOKEPOINT</text>

    <circle cx="480" cy="210" r="16" fill="#38bdf8" fill-opacity="0.25"/>
    <circle cx="480" cy="210" r="8" fill="#38bdf8"/>
    <text x="465" y="195" font-family="'Space Mono', monospace" font-size="10" font-weight="700" fill="#7dd3fc">STAGING AREA</text>

    <circle cx="620" cy="180" r="22" fill="#22c55e" fill-opacity="0.25"/>
    <circle cx="620" cy="180" r="9" fill="#22c55e"/>
    <text x="590" y="218" font-family="'Space Mono', monospace" font-size="10" font-weight="700" fill="#86efac">SAFE HARBOR</text>

    <!-- Map Floating HUD Box -->
    <rect x="24" y="24" width="220" height="84" rx="6" fill="#0d191c" fill-opacity="0.9" stroke="#22363a" stroke-width="1"/>
    <text x="38" y="46" font-family="'Space Mono', monospace" font-size="10" fill="#788a8c">SPATIAL ENGINE</text>
    <text x="38" y="66" font-family="sans-serif" font-size="14" font-weight="700" fill="#f8f8f2">PostGIS GeoClustering</text>
    <text x="38" y="86" font-family="'Space Mono', monospace" font-size="10" fill="#d4f34a">LAT: 18.5204° N, LON: 73.8567° E</text>
  </g>

  <!-- Right Side Decision Intelligence & Approval Panel -->
  <g transform="translate(804, 192)" filter="url(#shadow)">
    <rect width="372" height="460" rx="8" fill="url(#panel)" stroke="#22363a" stroke-width="1"/>
    <text x="24" y="36" font-family="-apple-system, sans-serif" font-size="16" font-weight="700" fill="#f8f8f2">Decision Intelligence Feed</text>
    <text x="24" y="56" font-family="'Space Mono', monospace" font-size="10" fill="#788a8c">RECOMMENDED ACTIONS // AUDIT QUEUE</text>

    <!-- Action Card 1 -->
    <rect x="20" y="74" width="332" height="98" rx="6" fill="#1b2e32" stroke="#2c474e" stroke-width="1"/>
    <text x="34" y="98" font-family="'Space Mono', monospace" font-size="10" fill="#ef4444" font-weight="700">MISSION RECOM-A04</text>
    <text x="34" y="118" font-family="sans-serif" font-size="13" font-weight="600" fill="#f8f8f2">Reroute Medical Unit 3 via Ridge Rd</text>
    <text x="34" y="136" font-family="sans-serif" font-size="11" fill="#94a3b8">Avoids flooding choke point. Saves 18 mins.</text>
    <rect x="236" y="142" width="102" height="22" rx="4" fill="#d4f34a"/>
    <text x="248" y="157" font-family="sans-serif" font-size="10" font-weight="700" fill="#132225">APPROVE ↗</text>

    <!-- Action Card 2 -->
    <rect x="20" y="184" width="332" height="98" rx="6" fill="#162528" stroke="#22363a" stroke-width="1"/>
    <text x="34" y="208" font-family="'Space Mono', monospace" font-size="10" fill="#f59e0b" font-weight="700">MISSION RECOM-A05</text>
    <text x="34" y="228" font-family="sans-serif" font-size="13" font-weight="600" fill="#f8f8f2">Deploy Supply Drone Unit B</text>
    <text x="34" y="246" font-family="sans-serif" font-size="11" fill="#94a3b8">Unassessed sector: Sector 4-East perimeter.</text>
    <rect x="236" y="252" width="102" height="22" rx="4" fill="#203a3f" stroke="#36545a" stroke-width="1"/>
    <text x="246" y="267" font-family="sans-serif" font-size="10" font-weight="700" fill="#cbd5e1">REVIEW ℹ</text>

    <!-- Offline Command Sync Status Box -->
    <rect x="20" y="294" width="332" height="142" rx="6" fill="#0f191b" stroke="#1d2f32" stroke-width="1"/>
    <text x="34" y="322" font-family="'Space Mono', monospace" font-size="10" fill="#d4f34a" font-weight="700">OFFLINE RESILIENCE BUFFER</text>
    <text x="34" y="344" font-family="sans-serif" font-size="12" fill="#cbd5e1">Degraded mesh network active.</text>
    <text x="34" y="362" font-family="sans-serif" font-size="12" fill="#94a3b8">12 commands queued locally for sync.</text>
    <!-- Mini Progress bar -->
    <rect x="34" y="380" width="304" height="6" rx="3" fill="#22363a"/>
    <rect x="34" y="380" width="240" height="6" rx="3" fill="#38bdf8"/>
    <text x="34" y="412" font-family="'Space Mono', monospace" font-size="10" fill="#788a8c">RECONCILIATION: 82% SYNCED</text>
  </g>
</svg>
